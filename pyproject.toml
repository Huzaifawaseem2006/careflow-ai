[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-ai"
version = "0.1.0"
description = "Synthetic-data clinic front-desk application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==1.15.0",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.143.1",
    "httpx2==2.13.1",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "playwright==1.55.0",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["careflow*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-p", "scripts.pytest_support"]
