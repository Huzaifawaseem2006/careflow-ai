name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install project and check tools
        run: python -m pip install -e '.[dev]'
      - name: Verify CI command behavior
        run: python -m pytest ci_tests -q
      - name: Run foundation checks
        run: python scripts/check_foundation.py
      - name: Record foundation result
        if: always()
        shell: bash
        run: |
          if [ -f test-results/foundation.json ]; then
            echo '### Foundation check report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/foundation.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
